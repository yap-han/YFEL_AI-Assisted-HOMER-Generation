[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-homer-evidence-prototype"
version = "0.4.0"
description = "Modular evidence retrieval, parameter validation and model-run registry for energy-mix studies"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
homer-gcc = "homer_gcc.cli:main"
homer-evidence = "homer_gcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
